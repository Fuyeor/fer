# /Cargo.toml
[workspace]
members = ["compiler-rs/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"

# Define dependencies here once for all crates
[workspace.dependencies]
diagnostics = { path = "compiler-rs/diagnostics" }
infra = { path = "compiler-rs/infra" }
vfs = { path = "compiler-rs/vfs" }
syntax = { path = "compiler-rs/syntax" }
query = { path = "compiler-rs/query" }
ir = { path = "compiler-rs/ir" }
fer = { path = "compiler-rs/fer" }
fon-parser = { git = "https://github.com/Fuyeor/fon-parser.git", branch = "main" }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"
